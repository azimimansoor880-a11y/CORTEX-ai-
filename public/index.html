<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORTEX AI Studio v0.6</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08090c;
  color:#fff;
  font-family:Arial,sans-serif
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:18px
}

.hero{
  padding:10px 2px 4px
}

.hero h1{
  margin:0;
  font-size:30px
}

.muted{
  color:#9297a3
}

.card{
  background:#121419;
  border:1px solid #292d36;
  border-radius:18px;
  padding:18px;
  margin-top:16px
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center
}

input[type=file]{
  width:100%;
  padding:12px;
  background:#0d0f13;
  border:1px solid #30343d;
  border-radius:12px;
  color:#ddd
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer
}

button.primary{
  background:#fff;
  color:#000
}

button.secondary{
  background:#292e37;
  color:#fff
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px
}

.pill{
  background:#1b1f27;
  border:1px solid #30343d;
  border-radius:999px;
  padding:8px 11px;
  color:#d7dbe2
}

.progress{
  height:8px;
  background:#22262e;
  border-radius:99px;
  overflow:hidden;
  margin-top:14px
}

.bar{
  height:100%;
  width:0;
  background:#fff;
  transition:.2s
}

.scenes{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  margin-top:14px
}

.scene{
  background:#0d0f13;
  border:1px solid #2a2e36;
  border-radius:16px;
  padding:14px
}

.scene h3{
  margin:0 0 7px
}

.scene small{
  color:#888f9b
}

.prompt{
  width:100%;
  min-height:115px;
  margin-top:10px;
  background:#090b0e;
  color:#fff;
  border:1px solid #30343d;
  border-radius:11px;
  padding:12px;
  resize:vertical
}

.preview{
  width:100%;
  margin-top:12px;
  border-radius:12px;
  display:block
}

.status{
  margin-top:10px;
  color:#aeb4bf;
  min-height:20px
}

.badge{
  font-size:12px;
  padding:5px 8px;
  border-radius:7px;
  background:#20242c;
  color:#cdd2da;
  float:right
}

.empty{
  color:#777f8c;
  text-align:center;
  padding:20px
}

.footer{
  color:#666d78;
  text-align:center;
  margin:20px 0 5px;
  font-size:12px
}

@media(min-width:760px){
  .scenes{
    grid-template-columns:1fr 1fr
  }

  .scene:first-child{
    grid-column:1/-1
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
<h1>⚡ CORTEX AI Studio v0.6</h1>
<div class="muted">
Song → 7 scenes → AI images
</div>
</div>


<div class="card">

<h2>🎵 1. Upload your song</h2>

<input
id="audio"
type="file"
accept="audio/*"
>

<div class="meta">

<div class="pill" id="fileName">
No song selected
</div>

<div class="pill" id="duration">
Duration: —
</div>

</div>

<button
id="analyze"
class="primary"
disabled
>
Build 7 Scenes 🔥
</button>

<div
class="status"
id="mainStatus"
></div>

<div class="progress">
<div
class="bar"
id="bar"
></div>
</div>

</div>


<div class="card">

<h2>🎬 2. Storyboard</h2>

<div
id="scenes"
class="scenes"
>

<div class="empty">
Upload a song and tap “Build 7 Scenes”.
</div>

</div>

</div>


<div class="footer">
CORTEX AI Studio v0.6
</div>

</div>


<script>

const audio =
document.getElementById('audio');

const analyze =
document.getElementById('analyze');

const fileName =
document.getElementById('fileName');

const durationEl =
document.getElementById('duration');

const status =
document.getElementById('mainStatus');

const bar =
document.getElementById('bar');

const scenesBox =
document.getElementById('scenes');

let songDuration = 0;


function fmt(sec){

if(!isFinite(sec))
return '—';

const m =
Math.floor(sec/60);

const s =
Math.floor(sec%60);

return `${m}:${String(s).padStart(2,'0')}`;
